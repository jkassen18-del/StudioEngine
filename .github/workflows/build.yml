name: Build Studio Engine

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" == "macOS" ]; then EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Reference-matcher smoke test
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install numpy
          python tests/make_test_audio.py test_audio
          CLI=""
          for c in build/studio_engine_cli build/Release/studio_engine_cli.exe build/studio_engine_cli.exe; do
            if [ -f "$c" ]; then CLI="$c"; break; fi
          done
          echo "using renderer: $CLI"
          "$CLI" test_audio/ref_dry.wav test_audio/ref_master.wav --set lim_drive=10 --set match_4k=3
          python tools/reference_match/studio_match.py analyze test_audio/ref_master.wav -o test_audio/ref.json
          python tools/reference_match/studio_match.py match --reference test_audio/ref.json \
            --vocal test_audio/raw_vocal.wav --cli "$CLI" -o test_audio/matched.json --iterations 3

      - name: Collect artefacts
        shell: bash
        run: |
          mkdir -p dist
          cp -R "build/StudioEngine_artefacts/Release/VST3" dist/ 2>/dev/null || true
          cp -R "build/StudioEngine_artefacts/Release/AU" dist/ 2>/dev/null || true
          cp -R "build/StudioEngine_artefacts/Release/Standalone" dist/ 2>/dev/null || true
          cp build/studio_engine_cli* dist/ 2>/dev/null || cp build/Release/studio_engine_cli* dist/ 2>/dev/null || true
          cp -R tools/reference_match dist/
          cp README.md dist/

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DAppVersion=1.0.0 /DSrcDir="$env:GITHUB_WORKSPACE\build\StudioEngine_artefacts\Release" installer\StudioEngine.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - name: Publish installer download
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-test-build
          name: Studio Engine - Windows test build
          prerelease: true
          files: dist/StudioEngine-Setup-*.exe
          body: |
            Windows installer for Studio Engine (latest test build).
            Download StudioEngine-Setup-1.0.0.exe below, run it, then rescan plugins in your DAW.
            Windows SmartScreen may warn because the installer is not code-signed: click "More info" -> "Run anyway".

      - uses: actions/upload-artifact@v4
        with:
          name: StudioEngine-${{ matrix.name }}
          path: dist
